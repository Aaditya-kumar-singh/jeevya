name: Jeevya Automatic Android Release

on:
  push:
    branches:
      - master

concurrency:
  group: jeevya-android-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build and release APK in GitHub Codespaces
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Authenticate GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::CODESPACES_TOKEN is not configured in GitHub Actions."
            echo "::error::Add it at Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

          echo "Checking GitHub token authentication..."
          if ! gh api user --jq '"Authenticated as: " + .login'; then
            echo "::error::CODESPACES_TOKEN is present but GitHub rejected it."
            echo "::error::Check that the token is active, belongs to the correct GitHub account, and has access to Aaditya-kumar-singh/jeevya."
            exit 1
          fi

      - name: Create dedicated release Codespace
        id: codespace
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
        run: |
          set -euo pipefail

          NAME="$(gh codespace create \
            --repo Aaditya-kumar-singh/jeevya \
            --branch master \
            --machine standardLinux32gb \
            --idle-timeout 60m \
            --retention-period 1h \
            --display-name "Jeevya Release ${GITHUB_RUN_NUMBER}" \
            --default-permissions)"

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Created Codespace: $NAME"

      - name: Wait for Codespace
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
          CODESPACE_NAME: ${{ steps.codespace.outputs.name }}
        run: |
          set -euo pipefail

          for i in {1..60}; do
            STATE="$(gh codespace view -c "$CODESPACE_NAME" --json state --jq '.state')"
            echo "Codespace state: $STATE"

            case "$STATE" in
              Available)
                exit 0
                ;;
              Shutdown|Deleted|Unavailable|Failed)
                echo "::error::Codespace entered terminal state: $STATE"
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "::error::Timed out waiting for Codespace."
          exit 1

      - name: Wait for Codespace SSH
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
          CODESPACE_NAME: ${{ steps.codespace.outputs.name }}
        run: |
          set -euo pipefail

          echo "Codespace is Available. Preparing SSH configuration..."
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          echo "Generating Codespaces SSH configuration..."
          gh codespace ssh -c "$CODESPACE_NAME" --config > "$HOME/.ssh/jeevya-codespace-config"
          chmod 600 "$HOME/.ssh/jeevya-codespace-config"

          echo "Checking SSH configuration..."
          grep -E "^(Host|HostName|User|IdentityFile|ProxyCommand)" "$HOME/.ssh/jeevya-codespace-config" || true
          SSH_HOST="$(awk '$1 == "Host" {print $2; exit}' "$HOME/.ssh/jeevya-codespace-config")"
          if [ -z "$SSH_HOST" ]; then
            echo "::error::Could not determine the SSH host alias from the Codespaces SSH configuration."
            exit 1
          fi
          echo "Using SSH host alias: $SSH_HOST"

          for i in {1..12}; do
            echo "SSH readiness attempt $i/12"
            if timeout 45s ssh -F "$HOME/.ssh/jeevya-codespace-config" "$SSH_HOST" "command -v node >/dev/null && command -v java >/dev/null && echo JEEVYA_CONTAINER_READY"; then
              echo "Codespace SSH and required runtimes are ready."
              exit 0
            fi

            echo "SSH is not ready yet."
            if [ "$i" -eq 12 ]; then
              echo "::error::Codespace became Available but SSH authentication/runtime readiness failed."
              echo "=== Codespace creation logs ==="
              gh codespace logs -c "$CODESPACE_NAME" || true
              exit 1
            fi

            sleep 15
          done

      - name: Build, sign, and publish from Codespace
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
          CODESPACE_NAME: ${{ steps.codespace.outputs.name }}
        run: |
          set -euo pipefail

          SSH_HOST="$(awk '$1 == "Host" {print $2; exit}' "$HOME/.ssh/jeevya-codespace-config")"
          ssh -F "$HOME/.ssh/jeevya-codespace-config" "$SSH_HOST" 'cd /workspaces/jeevya && set -euo pipefail && echo "=== Jeevya automated Codespace release ===" && echo "Commit: $(git rev-parse HEAD)" && echo "Branch: $(git branch --show-current)" && echo "Node: $(node --version)" && echo "Java:" && java -version && echo "Android SDK: $ANDROID_HOME" && npm ci && JEEVYA_AUTOMATED_RELEASE=true npm run ship'

      - name: Stop release Codespace
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
          CODESPACE_NAME: ${{ steps.codespace.outputs.name }}
        run: |
          if [ -n "${CODESPACE_NAME:-}" ]; then
            gh codespace stop -c "$CODESPACE_NAME" || true
          fi
