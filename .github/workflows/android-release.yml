1	name: Jeevya Automatic Android Release
    2	
    3	on:
    4	  push:
    5	    branches:
    6	      - master
    7	
    8	concurrency:
    9	  group: jeevya-android-release
   10	  cancel-in-progress: false
   11	
   12	permissions:
   13	  contents: read
   14	
   15	jobs:
   16	  release:
   17	    name: Build and release APK in GitHub Codespaces
   18	    runs-on: ubuntu-latest
   19	    timeout-minutes: 90
   20	
   21	    steps:
   22	      - name: Checkout release commit
   23	        uses: actions/checkout@v4
   24	
   25	      - name: Authenticate GitHub CLI
   26	        env:
   27	          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
   28	        run: |
   29	          set -euo pipefail
   30	
   31	          if [ -z "${GH_TOKEN:-}" ]; then
   32	            echo "::error::CODESPACES_TOKEN is not configured in GitHub Actions."
   33	            echo "::error::Add it at Settings → Secrets and variables → Actions → New repository secret."
   34	            exit 1
   35	          fi
   36	
   37	          echo "Checking GitHub token authentication..."
   38	          if ! gh api user --jq '"Authenticated as: " + .login'; then
   39	            echo "::error::CODESPACES_TOKEN is present but GitHub rejected it."
   40	            echo "::error::Check that the token is active, belongs to the correct GitHub account, and has access to Aaditya-kumar-singh/jeevya."
   41	            exit 1
   42	          fi
   43	
   44	      - name: Create dedicated release Codespace
   45	        id: codespace
   46	        env:
   47	          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
   48	        run: |
   49	          set -euo pipefail
   50	
   51	          NAME="$(gh codespace create \
   52	            --repo Aaditya-kumar-singh/jeevya \
   53	            --branch master \
   54	            --machine standardLinux32gb \
   55	            --idle-timeout 60m \
   56	            --retention-period 1h \
   57	            --display-name "Jeevya Release ${GITHUB_RUN_NUMBER}" \
   58	            --default-permissions)"
   59	
   60	          echo "name=$NAME" >> "$GITHUB_OUTPUT"
   61	          echo "Created Codespace: $NAME"
   62	
   63	      - name: Wait for Codespace
   64	        env:
   65	          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
   66	          CODESPACE_NAME: ${{ steps.codespace.outputs.name }}
   67	        run: |
   68	          set -euo pipefail
   69	
   70	          for i in {1..60}; do
   71	            STATE="$(gh codespace view -c "$CODESPACE_NAME" --json state --jq '.state')"
   72	            echo "Codespace state: $STATE"
   73	
   74	            case "$STATE" in
   75	              Available)
   76	                exit 0
   77	                ;;
   78	              Shutdown|Deleted|Unavailable|Failed)
   79	                echo "::error::Codespace entered terminal state: $STATE"
   80	                exit 1
   81	                ;;
   82	            esac
   83	
   84	            sleep 10
   85	          done
   86	
   87	          echo "::error::Timed out waiting for Codespace."
   88	          exit 1
   89	
   90	      - name: Wait for Codespace SSH
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
          CODESPACE_NAME: ${{ steps.codespace.outputs.name }}
        run: |
          set -euo pipefail

          echo "Codespace is Available. Preparing Codespaces SSH..."
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          if [ ! -f "$HOME/.ssh/codespaces.auto" ]; then
            echo "Creating dedicated Codespaces SSH key..."
            ssh-keygen -t ed25519 -N "" -f "$HOME/.ssh/codespaces.auto" -C "jeevya-github-actions"
          fi
          chmod 600 "$HOME/.ssh/codespaces.auto"
          chmod 644 "$HOME/.ssh/codespaces.auto.pub"

          echo "Connecting with gh codespace ssh so GitHub can establish the Codespaces tunnel..."
          for i in {1..12}; do
            echo "SSH readiness attempt $i/12"
            set +e
            timeout 60s gh codespace ssh -c "$CODESPACE_NAME" -- -i "$HOME/.ssh/codespaces.auto" "command -v node >/dev/null && command -v java >/dev/null && echo JEEVYA_CONTAINER_READY"
            STATUS=$?
            set -e

            if [ "$STATUS" -eq 0 ]; then
              echo "Codespace SSH and required runtimes are ready."
              exit 0
            fi

            echo "SSH readiness attempt failed with exit code $STATUS."
            if [ "$i" -eq 12 ]; then
              echo "::error::Codespace became Available but gh codespace ssh could not connect."
              echo "=== Codespace creation logs ==="
              gh codespace logs -c "$CODESPACE_NAME" || true
              exit 1
            fi

            sleep 15
          done

      - name: Build, sign, and publish from Codespace
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
          CODESPACE_NAME: ${{ steps.codespace.outputs.name }}
        run: |
          set -euo pipefail

          gh codespace ssh -c "$CODESPACE_NAME" -- -i "$HOME/.ssh/codespaces.auto" 'cd /workspaces/jeevya && set -euo pipefail && echo "=== Jeevya automated Codespace release ===" && echo "Commit: $(git rev-parse HEAD)" && echo "Branch: $(git branch --show-current)" && echo "Node: $(node --version)" && echo "Java:" && java -version && echo "Android SDK: $ANDROID_HOME" && npm ci && JEEVYA_AUTOMATED_RELEASE=true npm run ship'
      - name: Stop release Codespace
  155	        if: always()
  156	        env:
  157	          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
  158	          CODESPACE_NAME: ${{ steps.codespace.outputs.name }}
  159	        run: |
  160	          if [ -n "${CODESPACE_NAME:-}" ]; then
  161	            gh codespace stop -c "$CODESPACE_NAME" || true
  162	          fi
  163
