name: Jeevya Android Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jeevya-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Android release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npx tsc --noEmit
          npm test -- --runInBand
          npm run test:checks
          npx expo-doctor

      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN repository secret is missing."
            exit 1
          fi

      - name: Install EAS CLI
        run: npm install --global eas-cli@24.7.0

      - name: Build Android production artifact
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android --profile github-release --non-interactive --wait --json > eas-build.json
          cat eas-build.json

      - name: Extract build artifact
        id: artifact
        run: |
          node -e "
          const fs=require('fs');
          const raw=fs.readFileSync('eas-build.json','utf8').trim();
          const data=JSON.parse(raw);
          const build=Array.isArray(data) ? data[0] : data;
          const url=build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl;
          if(!url) throw new Error('EAS did not return an application artifact URL.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'url='+url+'\\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'id='+(build.id||'unknown')+'\\n');
          "

      - name: Download Android artifact
        run: curl -fL "${{ steps.artifact.outputs.url }}" -o jeevya-android-release

      - name: Determine release identity
        id: release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="build-$VERSION-$GITHUB_RUN_NUMBER"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="Jeevya-${{ steps.release.outputs.version }}-${{ github.run_number }}-android"
          mv jeevya-android-release "$FILE"
          gh release create "${{ steps.release.outputs.tag }}" "$FILE"             --title "Jeevya ${{ steps.release.outputs.version }} build ${{ github.run_number }}"             --notes "Automated Android release from commit $GITHUB_SHA.

          Version: ${{ steps.release.outputs.version }}
          EAS build: ${{ steps.artifact.outputs.id }}

          Validation:
          - TypeScript
          - Jest
          - Jeevya project checks
          - Expo Doctor"


